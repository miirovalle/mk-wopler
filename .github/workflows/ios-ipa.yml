name: ios-ipa

# Produces an installable .ipa containing the AUv3 app extension.
#
# The unsigned job runs on every push and is a compile check. The signed job is
# manual, because it needs an Apple signing identity supplied as repository
# secrets; see the README for the exact secret names and the two App IDs that
# have to exist in the developer portal.

on:
  push:
    branches: [main]
    paths:
      - 'Source/**'
      - 'Tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ios-ipa.yml'
  pull_request:
    paths:
      - 'Source/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ios-ipa.yml'
  workflow_dispatch:
    inputs:
      build_signed:
        description: 'Build a signed IPA (requires the IOS_* signing secrets)'
        type: boolean
        default: false

env:
  # Bundles AUv3 (the extension) and Standalone (the container app that embeds
  # it). Requesting the extension alone produces an .appex that cannot be
  # installed on its own.
  IOS_TARGET: MKWOPLER_Standalone
  IOS_SDK: iphoneos
  IOS_DEPLOYMENT_TARGET: '17.0'

jobs:
  # ---------------------------------------------------------------------------
  # Unsigned IPA. Always runs. The result must be re-signed before it will
  # install on a stock iPad, but it proves the whole iOS build path works and is
  # directly usable with Sideloadly / AltStore / Xcode.
  # ---------------------------------------------------------------------------
  unsigned-ipa:
    name: Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Configure for iPadOS
        run: |
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="${IOS_SDK}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build app with embedded AUv3
        run: |
          cmake --build build-ios --config Release \
            --target "${IOS_TARGET}" --parallel

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build-ios -type d -name '*.app' -not -path '*/Simulator/*' | head -n 1)"
          if [ -z "${APP_PATH}" ]; then
            echo "No .app bundle was produced" >&2
            find build-ios -maxdepth 4 -type d | head -n 40 >&2
            exit 1
          fi
          echo "App bundle: ${APP_PATH}"

          APPEX_COUNT="$(find "${APP_PATH}/PlugIns" -maxdepth 1 -name '*.appex' -type d 2>/dev/null | wc -l | tr -d ' ')"
          echo "Embedded app extensions: ${APPEX_COUNT}"
          find "${APP_PATH}/PlugIns" -maxdepth 1 -name '*.appex' >&2 || true
          if [ "${APPEX_COUNT}" = "0" ]; then
            echo "The AUv3 extension is missing from the app bundle" >&2
            exit 1
          fi

          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' \
            "${APP_PATH}/PlugIns/"*.appex/Info.plist || true

          rm -rf Payload MK-WOPLER-unsigned.ipa
          mkdir -p Payload
          cp -R "${APP_PATH}" Payload/
          zip -qry MK-WOPLER-unsigned.ipa Payload
          ls -lh MK-WOPLER-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MK-WOPLER-unsigned-ipa
          path: MK-WOPLER-unsigned.ipa
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Signed IPA. Manual only.
  #
  # Needs these repository secrets:
  #   IOS_CERT_P12_BASE64        Developer/Ad-hoc .p12, base64 encoded
  #   IOS_CERT_P12_PASSWORD      password for that .p12
  #   IOS_TEAM_ID                Apple Developer team id
  #   IOS_SIGNING_IDENTITY       optional; defaults to "Apple Development"
  #   IOS_PROFILE_APP_BASE64     .mobileprovision for the container app
  #   IOS_PROFILE_APP_NAME       its profile name (Xcode UI name)
  #   IOS_PROFILE_AUV3_BASE64    .mobileprovision for the AUv3 extension
  #   IOS_PROFILE_AUV3_NAME      its profile name
  # ---------------------------------------------------------------------------
  signed-ipa:
    name: Signed IPA
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Import signing identity
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.IOS_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12_BASE64}" ]; then
            echo "IOS_CERT_P12_BASE64 is not set" >&2
            exit 1
          fi
          KEYCHAIN="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 3600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"

          echo "${CERT_P12_BASE64}" | openssl base64 -d -A -out "${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -k "${KEYCHAIN}" \
            -P "${CERT_P12_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" > /dev/null
          security list-keychains -d user -s "${KEYCHAIN}" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "${KEYCHAIN}"
          rm -f "${RUNNER_TEMP}/cert.p12"
          security find-identity -v -p codesigning "${KEYCHAIN}"

      - name: Install provisioning profiles
        env:
          PROFILE_APP_BASE64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          PROFILE_AUV3_BASE64: ${{ secrets.IOS_PROFILE_AUV3_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_DIR="${HOME}/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "${PROFILE_DIR}"
          echo "${PROFILE_APP_BASE64}"  | openssl base64 -d -A -out "${PROFILE_DIR}/app.mobileprovision"
          echo "${PROFILE_AUV3_BASE64}" | openssl base64 -d -A -out "${PROFILE_DIR}/auv3.mobileprovision"
          for p in "${PROFILE_DIR}"/*.mobileprovision; do
            echo "--- ${p}"
            security cms -D -i "${p}" | plutil -extract Name raw - 2>/dev/null || true
            security cms -D -i "${p}" | plutil -extract Entitlements.application-identifier raw - 2>/dev/null || true
          done

      - name: Configure for iPadOS (manual signing)
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_APP_NAME: ${{ secrets.IOS_PROFILE_APP_NAME }}
          PROFILE_AUV3_NAME: ${{ secrets.IOS_PROFILE_AUV3_NAME }}
          SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY || 'Apple Development' }}
        run: |
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="${IOS_SDK}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_STYLE=Manual \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="${SIGNING_IDENTITY}" \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM="${TEAM_ID}" \
            -DWOB_APP_PROVISIONING_PROFILE="${PROFILE_APP_NAME}" \
            -DWOB_AUV3_PROVISIONING_PROFILE="${PROFILE_AUV3_NAME}"

      - name: Build signed app
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          cmake --build build-ios --config Release \
            --target "${IOS_TARGET}" --parallel \
            -- -allowProvisioningUpdates DEVELOPMENT_TEAM="${TEAM_ID}"

      - name: Package signed IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build-ios -type d -name '*.app' -not -path '*/Simulator/*' | head -n 1)"
          if [ -z "${APP_PATH}" ]; then
            echo "No .app bundle was produced" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"

          rm -rf Payload MK-WOPLER.ipa
          mkdir -p Payload
          cp -R "${APP_PATH}" Payload/
          zip -qry MK-WOPLER.ipa Payload
          ls -lh MK-WOPLER.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MK-WOPLER-signed-ipa
          path: MK-WOPLER.ipa
          if-no-files-found: error
